<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owly · อ่านหุ้นให้เข้าใจใน 1 นาที</title>
<meta name="description" content="Owly เริ่มจากแบรนด์ที่คุณใช้ทุกวัน แล้วแปลงบหุ้นเป็นภาษาคน ตรวจ 6 เรื่องก่อนตัดสินใจ ไม่ใช่คำแนะนำการลงทุน">
<meta name="theme-color" content="#1A1527" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15101F" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Owly — "quiet ledger" look.
   Colours come straight from the logo: night navy (ink), owl slate, lens teal, beak amber.
   Rules: one focal number per screen, teal only for interactive things, amber/red only for warnings,
   grouped lists instead of stacks of identical cards, tight spacing inside a group and wide between groups. */
:root{
  /* palette: Ink & Gold · night #1A1527 · navy #313D57 · brick #A63D3C · grey #666666 · paper #F7F4EE · gold #ECCB88 */
  --stage:#ECE8DF; --paper:#F7F4EE; --surface:#FFFFFF; --track:#EFEBE3;
  --ink:#1A1527; --ink-2:#313D57; --muted:#666666; --line:#E6E1D7; --line-2:#CFC8BA;
  --night:#1A1527; --night-2:#313D57; --indigo:#313D57; --sky:#ECCB88; --sky-2:#F7F4EE;
  --brand:#A63D3C; --lens:#313D57; --lens-soft:#E6E9F0; --slate:#313D57; --slate-soft:#E6E9F0;
  --warn:#94570A; --warn-fill:#D08A22; --warn-soft:#FCF0DC;
  --crit:#A63D3C; --crit-soft:#F7E3E2; --good:#2B7651; --good-soft:#E0F1E7; --na:#B8B4C2;
  --btn:#1A1527; --btn-ink:#FFFFFF; --mark-y:#313D57;
  --frame:#1A1527;
  --r-lg:18px; --r-md:14px; --r-sm:10px;
  --display:'Bai Jamjuree','IBM Plex Sans Thai','Noto Sans Thai',sans-serif;
  --body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#0E0B16; --paper:#15101F; --surface:#1A1527; --track:#2A2440;
    --ink:#F7F4EE; --ink-2:#DDD8E8; --muted:#B9B4C6; --line:#332D49; --line-2:#453E60;
    --night:#1A1527; --night-2:#1A1527; --indigo:#313D57; --sky:#ECCB88; --sky-2:#332D49;
    --brand:#ECCB88; --lens:#ECCB88; --lens-soft:#2A2440; --slate:#9AA8C9; --slate-soft:#2A2440;
    --warn:#EDB062; --warn-fill:#E59F43; --warn-soft:#3A2A12; --crit:#F08178; --crit-soft:#3D1D1B; --good:#6CCB96; --good-soft:#15321F; --na:#5A5470;
    --btn:#ECCB88; --btn-ink:#1A1527; --mark-y:#ECCB88; --frame:#000; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --stage:#0E0B16; --paper:#15101F; --surface:#1A1527; --track:#2A2440;
    --ink:#F7F4EE; --ink-2:#DDD8E8; --muted:#B9B4C6; --line:#332D49; --line-2:#453E60;
    --night:#1A1527; --night-2:#1A1527; --indigo:#313D57; --sky:#ECCB88; --sky-2:#332D49;
    --brand:#ECCB88; --lens:#ECCB88; --lens-soft:#2A2440; --slate:#9AA8C9; --slate-soft:#2A2440;
    --warn:#EDB062; --warn-fill:#E59F43; --warn-soft:#3A2A12; --crit:#F08178; --crit-soft:#3D1D1B; --good:#6CCB96; --good-soft:#15321F; --na:#5A5470;
    --btn:#ECCB88; --btn-ink:#1A1527; --mark-y:#ECCB88; --frame:#000; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3{font-family:var(--display);line-height:1.3;margin:0;text-wrap:balance;font-weight:600}
p{text-wrap:pretty}
.num{font-variant-numeric:tabular-nums}
a{color:var(--lens);text-underline-offset:3px}
button,input,textarea{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--lens);outline-offset:2px;border-radius:8px}
[hidden]{display:none !important}
.wordmark{font-family:var(--display);font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.wordmark i{font-style:normal;color:var(--mark-y)}

/* ---------- stage ---------- */
.stage{--ph:clamp(560px, calc(100vh - 40px), 812px);min-height:100%;display:grid;grid-template-columns:minmax(260px,400px) auto;gap:clamp(24px,5vw,72px);justify-content:center;align-items:center;padding:20px clamp(16px,3vw,32px)}
@supports (height:100dvh){.stage{--ph:clamp(560px, calc(100dvh - 40px), 812px)}}
.notes{display:flex;flex-direction:column;gap:22px;max-width:400px}
.brandline{display:flex;align-items:center;gap:12px}
.brandline img{width:56px;height:56px;flex:none;padding:4px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.brandline .wordmark{font-size:34px;line-height:1}
.notes .kicker{font-size:13px;color:var(--muted);margin-bottom:10px}
.notes .pitch{margin:0;font-size:16.5px;color:var(--ink-2);max-width:34ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px;counter-reset:s}
.steps button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:12px;align-items:center;text-align:left;border:0;background:transparent;border-radius:var(--r-sm);padding:7px 10px;cursor:pointer;color:var(--muted);font-size:14.5px}
.steps button:hover{color:var(--ink)}
.steps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:12.5px;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.steps button[aria-current="step"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line)}
.steps button[aria-current="step"] .n{background:var(--ink);box-shadow:none;color:var(--paper)}
.notecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;display:grid;gap:10px}
.notecard h2{font-size:18px}
.notecard ul{margin:0;padding-left:18px;display:grid;gap:7px;font-size:14.5px;color:var(--ink-2)}
.notecard li::marker{color:var(--slate)}
.crit-tags{display:flex;gap:6px;flex-wrap:wrap}
.crit-tags span{font-size:12px;font-weight:600;padding:2px 9px;border-radius:6px;background:var(--slate-soft);color:var(--slate)}
.stage-foot{font-size:12.5px;color:var(--muted);margin:0;max-width:40ch}

.phone{height:var(--ph);width:calc(var(--ph) * 0.48);border-radius:calc(var(--ph) * 0.064);background:var(--frame);padding:calc(var(--ph) * 0.0148);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 40px 80px -30px rgba(20,31,49,.55),0 12px 24px -12px rgba(20,31,49,.3);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:calc(var(--ph) * 0.05);overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.statusbar{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600;font-family:var(--display)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:var(--frame)}
#app{flex:1;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
#app::-webkit-scrollbar{display:none}
@media (max-width:900px) and (min-width:720px){
  .stage{grid-template-columns:minmax(240px,1fr) auto}
  .notes{gap:16px}
  .notes .pitch{font-size:15px}
  .notecard ul{font-size:13.5px}
}
@media (max-width:719px), (max-height:500px) and (pointer:coarse){
  html,body{background:var(--paper)}
  .stage{display:block;padding:0;min-height:0}
  .notes{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--paper)}
  .screen{border-radius:0;height:100%;max-width:600px;margin:0 auto;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .notch,.statusbar{display:none}
  .tabbar{padding-bottom:max(10px, env(safe-area-inset-bottom))}
}
@media (max-width:719px) and (min-width:601px), (max-height:500px) and (pointer:coarse) and (min-width:601px){
  .phone{background:var(--stage)}
  .screen{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

/* ---------- app: shared ---------- */
.pad{padding:0 20px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.chip{font-size:12px;font-weight:600;line-height:1.5;padding:2px 8px;border-radius:6px;white-space:nowrap}
.c-crit{background:var(--crit-soft);color:var(--crit)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-good{background:var(--good-soft);color:var(--good)} .c-info{background:var(--lens-soft);color:var(--lens)}
.label{font-size:12.5px;font-weight:600;color:var(--muted)}
.sec-title{font-family:var(--display);font-size:15px;font-weight:600;color:var(--ink);margin:28px 20px 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-title em{font-style:normal;font-family:var(--body);font-weight:400;font-size:12.5px;color:var(--muted)}
.group{margin:0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.group > * + *{border-top:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.card h3{font-size:15.5px;margin-bottom:6px}
.card p{margin:0;font-size:14px;color:var(--ink-2)}
.btn{border:0;background:var(--btn);color:var(--btn-ink);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;min-height:44px}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.ghostbtn{border:1px solid var(--line-2);background:transparent;border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600;color:var(--ink);display:inline-flex;gap:8px;align-items:center}
.ghostbtn:hover{background:var(--surface)}
.textbtn{border:0;background:none;padding:6px 0;margin:-6px 0;color:var(--lens);font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.textbtn svg{transition:transform .2s ease}
.textbtn[aria-expanded="true"] svg{transform:rotate(90deg)}
.offline{font-size:12px;color:var(--muted)}
.disclaimer{font-size:12px;color:var(--muted);padding:0 20px 28px;margin:20px 0 0;line-height:1.55}

/* ---------- home ---------- */
.appbar{display:flex;align-items:center;gap:10px;padding:10px 20px 6px}
.appbar .mark{width:38px;height:38px;flex:none;padding:3px;border-radius:50%;background:#F7F4EE}
.appbar .wordmark{font-size:23px;line-height:1}
.appbar .sub{font-size:12.5px;color:var(--muted);line-height:1.3}
.topband{background:var(--night);color:#FFFFFF;padding-bottom:4px;border-radius:0 0 26px 26px;--ink:#FFFFFF;--ink-2:#E6F7FE;--muted:#D8D3E3;--line:rgba(247,244,238,.2);--track:rgba(247,244,238,.18);--mark-y:#ECCB88;--lens:#F7F4EE}
.screen:has(.topband) .statusbar{background:var(--night);color:#FFFFFF}
.hero{position:relative;margin:8px 20px 0;padding:16px 0 22px}
.hero-owl{position:absolute;right:-4px;top:4px;bottom:auto;width:92px;height:92px;padding:10px;border-radius:50%;background:#F7F4EE;box-shadow:0 0 0 6px rgba(236,203,136,.35);pointer-events:none}
.hero .tally{max-width:100%}
.hero .label{display:block;margin-bottom:6px}
.hero .big{font-family:var(--display);font-size:46px;font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--ink);display:flex;align-items:baseline;gap:8px}
.hero .big small{font-size:18px;font-weight:600;color:var(--muted);letter-spacing:0}
.hero p{margin:8px 0 12px;font-size:15px;color:var(--ink-2)}
.tally{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;max-width:300px}
.tally i{height:14px;border-radius:3px;background:var(--track)}
.tally i.down{background:#FF9F95}
.hero .srcline{display:block;margin-top:10px;font-size:12px;color:var(--muted)}
.promo{margin:16px 16px 0;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--indigo);color:#FFFFFF;border:0;border-radius:var(--r-lg);padding:12px 16px 12px 12px;cursor:pointer;text-align:left;width:calc(100% - 32px);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.promo img{width:56px;height:56px;display:block;padding:5px;border-radius:50%;background:#F7F4EE}
.promo b{font-family:var(--display);display:block;font-size:15.5px;font-weight:600}
.promo span{font-size:12.5px;color:#E6E1D7}
.promo .play{width:40px;height:40px;border-radius:50%;background:#ECCB88;display:grid;place-items:center;color:#1A1527}
.promo:hover .play{background:#F7F4EE}
.row{display:grid;grid-template-columns:44px 1fr auto 12px;gap:12px;align-items:center;background:transparent;border:0;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.row:hover{background:var(--paper)}
.row .t{font-weight:600;display:block;line-height:1.35}
.row .m{font-size:12.5px;color:var(--muted);display:block;line-height:1.45}
.row .when{white-space:nowrap}
.row .chev{color:var(--line-2)}
.ringkey{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 20px 0;font-size:12px;color:var(--muted)}
.ringkey span{display:inline-flex;align-items:center;gap:6px}
.ringkey i{width:10px;height:10px;border-radius:3px}

/* ---------- IPO card ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px 4px}
.back{border:0;background:transparent;width:44px;height:44px;margin-left:-8px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.back:hover{background:var(--surface)}
.ipohead{padding:6px 20px 16px;display:grid;gap:2px}
.ipohead .m{font-size:12.5px;color:var(--muted)}
.ipohead h2{font-size:25px;font-weight:700;line-height:1.25}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.kv div{padding:10px 12px;min-width:0}
.kv div + div{border-left:1px solid var(--line)}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-family:var(--display);font-size:17px;font-weight:600;white-space:nowrap}
.kv b small{font-size:12px;font-weight:500;color:var(--muted)}

.seg{position:sticky;top:0;z-index:2;background:color-mix(in srgb, var(--paper) 92%, transparent);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);padding:8px 16px 10px}
.seg .track{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--track);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;min-height:36px;border-radius:9px;cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:500}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(20,31,49,.12),0 0 0 .5px rgba(20,31,49,.06)}
.tab{padding:8px 16px 8px;display:grid;gap:12px}
.tab > h3{font-size:15px;margin:14px 4px -2px}

.verdict{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center}
.verdict .label{display:block;margin-bottom:4px}
.verdict .count{font-family:var(--display);font-size:17px;font-weight:600;line-height:1.3}
.verdict .count b{font-size:26px;font-weight:700;margin-left:2px}
.verdict p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.ring text{font-family:var(--display)}
.legend{list-style:none;margin:14px 0 0;padding:12px 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend li{display:flex;gap:7px;align-items:flex-start;line-height:1.45}
.legend i{flex:none;width:9px;height:9px;border-radius:3px;margin-top:5px}
.legend .s-na{color:var(--muted)}
.i-crit{background:var(--crit)} .i-warn{background:var(--warn-fill)} .i-ok{background:var(--good)} .i-na{background:var(--na)}
.card .summary-text{margin:14px 0 0;font-size:14.5px;color:var(--ink-2)}

.sig{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:14px 16px}
.sig .ico{width:22px;height:22px;margin-top:1px}
.sig .lvl{font-size:11.5px;font-weight:600;letter-spacing:.02em}
.sig.crit .lvl{color:var(--crit)} .sig.warn .lvl{color:var(--warn)}
.sig b{display:block;font-size:14.5px;line-height:1.4;margin:1px 0 4px}
.sig p{margin:0 0 6px;font-size:13.5px;color:var(--ink-2)}
.srcnote{font-size:12.5px;color:var(--muted);margin-top:8px;padding:8px 10px;background:var(--paper);border-radius:8px}

.outcome{padding:16px}
.outcome h3{font-size:15px}
.timeline{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:12px}
.timeline li{position:relative;padding-left:20px;font-size:13.5px;color:var(--ink-2)}
.timeline li::before{content:'';position:absolute;left:3px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--crit)}
.timeline li + li::after{content:'';position:absolute;left:7px;top:-12px;height:19px;border-left:1.5px solid var(--line-2)}
.list{margin:0;padding-left:20px;display:grid;gap:6px;font-size:13.5px;color:var(--ink-2)}
.list li::marker{color:var(--slate)}
ol.list li::marker{font-family:var(--display);font-weight:600}

.bars text{font-family:var(--body);fill:var(--muted)}
.bars .v{fill:var(--ink);font-weight:600}
.metric{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px;padding:9px 0;border-bottom:1px solid var(--line)}
.metric:last-of-type{border-bottom:0}
.metric b{font-family:var(--display);font-weight:600}
.pe-row{display:grid;grid-template-columns:96px 1fr 56px;gap:10px;align-items:center;font-size:13px;margin-top:8px}
.pe-bar{height:10px;border-radius:5px;background:var(--na)}
.pe-bar.me{background:var(--slate)}

.rule{display:grid;grid-template-columns:20px 1fr;gap:10px;font-size:13px;color:var(--ink-2);background:var(--slate-soft);border-radius:var(--r-md);padding:12px 14px}
.claim{padding:14px 16px;display:grid;gap:8px}
.claim-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.claim-top b{font-size:14px;line-height:1.45;font-weight:600}
.meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.claim .why{font-size:12.5px;color:var(--muted)}
.srcs{display:flex;flex-wrap:wrap;gap:6px}
.srcs a{font-size:11.5px;text-decoration:none;padding:2px 8px;border-radius:6px;background:var(--paper);color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.srcs a::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--na)}
.srcs a.agree::before{background:var(--good)}
.srcs a.disagree::before{background:var(--crit)}
.srcs a.copy{color:var(--muted);background:transparent;box-shadow:inset 0 0 0 1px var(--line-2)}

.chat{display:grid;gap:10px}
.bubble{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14px;white-space:pre-wrap;line-height:1.55}
.bubble.me{justify-self:end;background:var(--btn);color:var(--btn-ink);border-bottom-right-radius:5px}
.bubble.ai{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.aihead{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.aihead img{width:34px;height:34px;flex:none}
.suggest{display:flex;flex-wrap:wrap;gap:6px}

.sec-title h2{font-size:inherit;font-weight:inherit;margin:0}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 12px;scrollbar-width:none}

.cats button{flex:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:7px 14px;min-height:38px;font-size:13.5px;cursor:pointer}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 16px}
.tile{display:grid;gap:4px;align-content:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 12px 12px 14px;cursor:pointer;min-height:136px;transition:border-color .15s ease,transform .15s ease}

.tile b{font-family:var(--display);font-size:15.5px;font-weight:600;line-height:1.3;color:var(--ink)}

.tile-flag i{width:8px;height:8px;border-radius:50%}

.noresult{padding:6px 20px 0;font-size:13.5px;color:var(--muted)}

.calm{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:14px 16px;font-size:13.5px;color:var(--ink-2)}
.tab .group{margin:0}
/* ---------- tab bar + reels ---------- */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 10px 14px}
.tabbar button{position:relative;border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer;padding:6px 4px;min-height:48px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabbar button[aria-current="page"]::before{content:'';position:absolute;top:-7px;left:50%;width:28px;margin-left:-14px;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
.screen.dark{background:#120E1C}
.screen.dark .statusbar{color:#fff}
.screen.dark #app{overflow:hidden}
.screen.dark .tabbar{background:#120E1C;border-color:#332D49}
.screen.dark .tabbar button{color:#8FA1B5}
.screen.dark .tabbar button[aria-current="page"]{color:#ECCB88}
.reels{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;background:#120E1C;--crit:#EF7A72;--warn:#F1AA53;--warn-fill:#F1AA53;--good:#6FD39B;--na:#45556B;--ink:#F2F6FA;--muted:#9FB0C3}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:#F2F6FA;background:#1A1527;cursor:pointer;user-select:none}

.reelchecks i{width:10px;height:10px;border-radius:3px;background:#ECCB88;flex:none}
.reel .ring circle{opacity:0;transition:opacity .25s ease}

.reel .ring text{fill:#F2F6FA}

.ai-label{position:absolute;top:72px;right:12px;z-index:3;font-size:11px;padding:2px 9px;border-radius:999px;background:rgba(236,203,136,.16);color:#9FE3E9;pointer-events:none}

.owl .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}

.reel.anchor .reel-meta{right:76px}

  .owl .lid{animation:blink 4.2s infinite}

  @keyframes blink{0%,94%,100%{transform:scaleY(0)}96%,98%{transform:scaleY(1)}}

}
@media (prefers-reduced-motion: reduce){

}

.sr-px{text-align:right;white-space:nowrap;font-size:14px}

.mtx b{font-size:14.5px;font-weight:600}

.switch{position:relative;width:46px;height:28px;border-radius:999px;border:0;background:var(--na);cursor:pointer;transition:background .15s ease}
.switch::before{content:'';position:absolute;inset:-8px -4px}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;transition:transform .15s ease}

.about-box{padding:0 14px 12px 62px;font-size:13px;line-height:1.55;color:var(--ink-2)}

.amtinput input{flex:1;min-width:0;min-height:56px;border:0;outline:0;background:transparent;color:var(--ink);font-family:var(--display);font-size:28px;font-weight:700}
.quick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:600}
.ways{display:grid;gap:8px;margin-top:10px}
.way{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:56px;padding:10px 14px;border:1.5px solid var(--line-2);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.way span{display:grid;gap:1px} .way small{font-size:12.5px;color:var(--muted)}
.way i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--na)}
.way[aria-checked="true"]{border-color:var(--lens);background:var(--lens-soft)}
.way[aria-checked="true"] i{border-color:var(--lens);background:radial-gradient(circle,var(--lens) 0 4px,transparent 5px)}
.btn.confirm{width:100%;min-height:50px;font-size:15px}
.btn.confirm:disabled{opacity:.45;cursor:not-allowed}
.toast{position:absolute;left:50%;bottom:92px;transform:translateX(-50%);z-index:40;max-width:88%;padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:13.5px;text-align:center;box-shadow:0 6px 20px rgba(26,21,39,.3)}
.toast[hidden]{display:none}
.tabbar{grid-template-columns:repeat(4,1fr)}
.kvlist .srow,.txrow{grid-template-columns:minmax(0,1fr) auto}
.kvlist .srow>span:empty,.txrow>span:empty{display:none}

.promo .chev{color:#ECCB88}

const outletOf = id => SRC[id].outlet;
function scoreClaim(c){
  const indep = new Set(c.topicSources.filter(id => !c.copies.includes(id)).map(outletOf));
  const agreeOut = new Set(c.agree.filter(id => !c.copies.includes(id)).map(outletOf));
  const disOut = new Set(c.disagree.map(outletOf));
  const n = new Set([...agreeOut, ...disOut]).size || indep.size;
  const pct = n ? Math.round(agreeOut.size / n * 100) : 0;
  let verdict, cls;
  if (c.pr && indep.size < 2){ verdict = 'ยืนยันไม่ได้ มาจากบริษัทเอง'; cls = 'c-warn'; }
  else if (n < 2){ verdict = 'มีแหล่งเดียว ยังไม่พอยืนยัน'; cls = 'c-warn'; }
  else if (pct >= 80){ verdict = 'น่าเชื่อถือ'; cls = 'c-good'; }
  else { verdict = 'ข้อมูลยังขัดกัน'; cls = 'c-crit'; }
  return {n, pct, verdict, cls};
}

/* ---------- voice (device text-to-speech, Thai) ---------- */
const voice = {supported:'speechSynthesis' in window, unlocked:false, muted:false, th:null, listed:false, male:false};
function pickVoice(){
  if (!voice.supported) return;
  const v = speechSynthesis.getVoices();
  if (v.length) voice.listed = true;
  const thai = v.filter(x => /^th/i.test(x.lang));
  const male = thai.find(x => /niwat|pattara|male|man\b|ชาย/i.test(x.name));
  voice.th = male || thai[0] || null;
  voice.male = !!male;
}
if (voice.supported){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const canSpeakThai = () => voice.supported && !voice.muted && (voice.th || !voice.listed);

  return line.chip || null;
}

function reelEl(i){ return document.querySelector(`.reel[data-reel="${i}"]`); }
function paint(){
  const el = reelEl(player.reel); if (!el || REELS[player.reel].type === 'anchor') return;
  el.querySelectorAll('.scene').forEach((s, k) => {
    const was = s.classList.contains('on'), now = k === player.scene;
    s.classList.toggle('on', now);
    if (now && !was) countUp(s);
  });
  el.querySelectorAll('.progress i').forEach((b, k) => {
    b.style.width = k < player.scene ? '100%' : k > player.scene ? '0%' : Math.min(100, player.t / SCENE_MS * 100) + '%';
  });
  el.querySelector('.pausemark').hidden = !player.paused;
}
function countUp(sceneEl){
  sceneEl.querySelectorAll('[data-count]').forEach(n => {
    const end = +n.dataset.count, suf = n.dataset.suffix || '', t0 = performance.now();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches){ n.textContent = end + suf; return; }
    const step = now => { const p = Math.min(1, (now - t0) / 900); n.textContent = Math.round(end * p) + suf; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function startReel(i){
  clearInterval(player.timer);
  anchorStop();
  if (REELS[i].type === 'anchor'){ player.reel = i; state.reel = i; anchorReset(i); return; }
  if (player.reel !== i){ const old = reelEl(player.reel); if (old) old.querySelectorAll('.scene').forEach((s, k) => s.classList.toggle('on', k === 0)); }
  Object.assign(player, {reel:i, scene:0, t:0, paused:false, ended:false});
  state.reel = i;
  const el = reelEl(i); if (el) el.querySelectorAll('.scene').forEach(s => s.classList.remove('on'));
  paint();
  player.timer = setInterval(tick, 50);
}
function tick(){
  if (player.paused || player.ended) return;
  player.t += 50;
  if (player.t >= SCENE_MS){
    const n = REELS[player.reel].scenes.length;
    if (player.scene < n - 1){ player.scene++; player.t = 0; }
    else { player.t = SCENE_MS; player.ended = true; }
  }

}
function stopPlayer(){ clearInterval(player.timer); anchorStop(); if (player.io) player.io.disconnect(); player.io = null; }
function bindReels(){
  const box = document.getElementById('reels'); if (!box) return;
  box.scrollTop = (state.reel || 0) * box.clientHeight;
  player.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) startReel(+e.target.dataset.reel); }), {root:box, threshold:0.6});
  box.querySelectorAll('.reel').forEach(r => player.io.observe(r));
  box.querySelectorAll('[data-tapstart]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.tapstart; voice.unlocked = true; b.hidden = true;
    if (voice.supported){ try { speechSynthesis.cancel(); speechSynthesis.resume(); } catch(e){} }
    const from = b.dataset.resume ? +b.dataset.resume : 0; delete b.dataset.resume;
    player.reel = i; anchorPlay(i, from);
  }));
  box.querySelectorAll('[data-mute]').forEach(b => b.addEventListener('click', () => {
    voice.muted = !voice.muted;
    box.querySelectorAll('[data-mute]').forEach(x => { x.setAttribute('aria-pressed', String(voice.muted)); x.classList.toggle('on', voice.muted); });
    if (player.running){ const i = player.reel, k = player.line; anchorStop(); anchorPlay(i, k); }
  }));
  box.querySelectorAll('[data-rewrite]').forEach(b => b.addEventListener('click', () => rewriteWithAI(+b.dataset.rewrite, b)));
  box.querySelectorAll('.reel').forEach(r => {
    let sx = 0, sy = 0, st = 0;
    r.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; st = Date.now(); });
    r.addEventListener('pointerup', e => {
      const dx = e.clientX - sx, dy = e.clientY - sy, id = REELS[+r.dataset.reel].ipo;
      if (!id || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - st > 900) return;
      r.dataset.swiped = '1';
      openBuy(id, 'reels', +r.dataset.reel, dx > 0 ? 'r' : 'l');
    });
  });
  box.querySelectorAll('[data-buy]').forEach(b => b.addEventListener('click', () => openBuy(b.dataset.buy, 'reels', +b.dataset.from, 'l')));
  box.querySelectorAll('.reel').forEach(r => r.addEventListener('click', e => {
    if (r.dataset.swiped){ delete r.dataset.swiped; return; }
    if (e.target.closest('button,a')) return;
    const i = +r.dataset.reel; if (i !== player.reel) return;
    if (REELS[i].type === 'anchor'){
      if (!voice.unlocked) return;
      const x = (e.clientX - r.getBoundingClientRect().left) / r.clientWidth, n = REELS[i].lines.length;
      if (x < 0.3){ anchorStop(); anchorPlay(i, Math.max(0, player.line - 1)); }
      else if (x > 0.7){ anchorStop(); anchorPlay(i, Math.min(n - 1, player.line + 1)); }
      else if (player.running){ anchorStop(); const tap = r.querySelector('.tapstart'); tap.hidden = false; tap.querySelector('span').textContent = 'ฟังต่อ'; tap.dataset.resume = player.line; }
      return;
    }
    const x = (e.clientX - r.getBoundingClientRect().left) / r.clientWidth, n = REELS[i].scenes.length;
    if (x < 0.3){ player.scene = Math.max(0, player.scene - 1); player.t = 0; player.ended = false; }
    else if (x > 0.7){ if (player.scene < n - 1){ player.scene++; player.t = 0; } }
    else if (player.ended){ startReel(i); return; }
    else player.paused = !player.paused;
    paint();
  }));
  box.querySelectorAll('[data-opencard]').forEach(b => b.addEventListener('click', () => go({screen:'ipo', ipo:b.dataset.opencard, tab:'summary'})));
}

function bindBuy(){
  const app = document.getElementById('app'), ipo = IPOS[state.ipo];
  const back = () => state.from === 'reels' ? go({screen:'reels', reel:state.reel}) : go({screen:'ipo', ipo:ipo.id, tab:'summary'});
  app.querySelectorAll('[data-buyback]').forEach(b => b.addEventListener('click', back));
  const input = document.getElementById('qty'); if (!input) return;
  const ack = document.getElementById('ack'), btn = document.getElementById('confirmbuy');
  const paintTotals = () => {
    const q = state.qty, t = buyTotals(ipo, q);
    document.getElementById('t-gross').textContent = fmt(t.gross) + ' บาท';
    document.getElementById('t-fee').textContent = fmt(t.fee) + ' บาท';
    document.getElementById('t-total').textContent = fmt(t.total) + ' บาท';
    const pct = Math.min(100, t.total / BUDGET * 100), bar = document.getElementById('budget');
    bar.querySelector('i').style.width = pct + '%'; bar.classList.toggle('over', t.total > BUDGET);
    bar.setAttribute('aria-label', 'ใช้งบไป ' + Math.round(t.total / BUDGET * 100) + '% ของงบเดือนนี้');
    document.getElementById('budgetnote').textContent = t.total > BUDGET ? 'เกินงบที่ตั้งไว้ ' + fmt(t.total - BUDGET) + ' บาท ลองลดจำนวนหุ้นดูก่อน' : 'ยังอยู่ในงบ เหลืออีก ' + fmt(BUDGET - t.total) + ' บาท';
    document.getElementById('oddlot').textContent = q < 100 ? 'ซื้อต่ำกว่า 100 หุ้นจะเป็นหุ้นเศษ (odd lot) ซึ่งซื้อขายแยกกระดาน' : 'ครบ 100 หุ้นขึ้นไป ซื้อขายในกระดานปกติ';
    btn.disabled = !(ack.checked && q >= 1);
  };
  const setQ = n => { state.qty = Math.max(1, Math.min(100000, Math.floor(n) || 1)); input.value = state.qty; paintTotals(); };
  input.addEventListener('input', () => { const n = parseInt(input.value, 10); if (n >= 1){ state.qty = Math.min(100000, n); paintTotals(); } });
  input.addEventListener('blur', () => setQ(parseInt(input.value, 10)));
  app.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => setQ(state.qty + +b.dataset.step)));
  app.querySelectorAll('[data-setq]').forEach(b => b.addEventListener('click', () => setQ(+b.dataset.setq)));
  ack.addEventListener('change', () => { state.ack = ack.checked; paintTotals(); });
  btn.addEventListener('click', () => { state.done = true; rerender(); });
  paintTotals();
}

function fmtP(f){
  const a = f.from, b = f.to, same = a.slice(0, 7) === b.slice(0, 7);
  return same ? `${+a.slice(8, 10)} – ${fmtD(b)}` : `${+a.slice(8, 10)} ${TH_M[+a.slice(5, 7) - 1]} – ${fmtD(b)}`;
}
const todayISO = () => new Date(Date.now() + 7 * 36e5).toISOString().slice(0, 10);
function fundStatus(f){
  if (!f.to) return null;
  const t = Date.parse(todayISO()), left = Math.round((Date.parse(f.to) - t) / 864e5);
  if (Date.parse(f.from) > t) return {s:'soon', label:'เปิดขาย ' + fmtD(f.from), cls:'c-info', left};
  if (left < 0) return {s:'closed', label:'ปิดขายแล้ว', cls:'c-off', left};
  if (left === 0) return {s:'open', label:'ปิดขายวันนี้', cls:'c-warn', left};
  return {s:'open', label:'ปิดขายอีก ' + left + ' วัน', cls: left <= 2 ? 'c-warn' : 'c-good', left};
}

function ring(ipo, size){
  const r = size * 0.38, c = size / 2, C = 2 * Math.PI * r, seg = C / 6, gap = size > 60 ? 6 : 4;
  const col = {crit:'var(--crit)', warn:'var(--warn-fill)', ok:'var(--good)', na:'var(--na)'};
  const found = CHECKS.filter(k => ['crit','warn'].includes(ipo.checks[k.key])).length;
  let s = `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="พบสัญญาณเตือน ${found} จาก 6 เรื่อง">`;
  CHECKS.forEach((k, i) => {
    s += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col[ipo.checks[k.key]]}" stroke-width="${size * 0.11}" stroke-dasharray="${seg - gap} ${C - seg + gap}" stroke-dashoffset="${-i * seg}" transform="rotate(-90 ${c} ${c})" stroke-linecap="butt"/>`;
  });
  s += `<text x="${c}" y="${c + size * 0.08}" text-anchor="middle" font-size="${size * 0.26}" font-weight="700" fill="var(--ink)">${found}<tspan font-size="${size * 0.14}" fill="var(--muted)">/6</tspan></text></svg>`;
  return s;
}
function foundCount(ipo){ return CHECKS.filter(k => ['crit','warn'].includes(ipo.checks[k.key])).length; }
function levelChip(ipo){
  const n = foundCount(ipo), crit = Object.values(ipo.checks).includes('crit');
  return `<span class="chip ${n === 0 ? 'c-good' : crit ? 'c-crit' : 'c-warn'}">${n ? 'พบ ' + n + ' สัญญาณ' : 'ไม่พบสัญญาณ'}</span>`;
}

    const vals = f.profit, max = Math.max(...vals), min = Math.min(...vals, 0), span = max - min, h = 130, top = 26;
    const base = top + h * (max / span), colW = (W - 10) / vals.length;
    let s = `<svg class="bars" viewBox="0 0 ${W} 200" width="100%" role="img" aria-label="กำไรสุทธิรายไตรมาสของ ${ipo.ticker}">`;
    s += `<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--muted)" stroke-width="2"/></pattern></defs>`;
    s += `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
    vals.forEach((v, i) => {
      const x = 5 + i * colW + colW * 0.2, w = colW * 0.6, bh = Math.max(Math.abs(v) / span * h, 2), y = v >= 0 ? base - bh : base;
      const fill = i === f.after ? 'url(#hatch)' : i === f.hot ? 'var(--crit)' : v < 0 ? 'var(--na)' : 'var(--slate)';
      s += `<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="3" fill="${fill}"/>`;
      s += `<text class="v num" x="${x + w / 2}" y="${v >= 0 ? y - 5 : y + bh + 13}" font-size="11.5" text-anchor="middle">${fmt(v)}</text>`;
      s += `<text x="${x + w / 2}" y="194" font-size="11" text-anchor="middle">${f.labels[i]}</text>`;
    });
    return s + '</svg>';
  }
  const row = (vals, top, h, label, hotOn) => {
    const max = Math.max(...vals, 0), min = Math.min(...vals, 0), span = (max - min) || 1, base = top + h * (max / span), colW = (W - 60) / vals.length;
    let o = `<text x="0" y="${top + h / 2 + 4}" font-size="12" style="fill:var(--ink);font-weight:600">${label}</text><line x1="60" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
    vals.forEach((v, i) => {
      const x = 60 + i * colW + colW * 0.2, w = colW * 0.6, bh = Math.max(Math.abs(v) / span * h, 2), y = v >= 0 ? base - bh : base;
      const fill = hotOn && i === ipo.fin.hot ? 'var(--crit)' : v < 0 ? 'var(--na)' : 'var(--slate)';
      o += `<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="3" fill="${fill}"/><text class="v num" x="${x + w / 2}" y="${v >= 0 ? y - 4 : y + bh + 12}" font-size="11" text-anchor="middle">${fmt(v)}</text>`;
    });
    return o;
  };
  let s = `<svg class="bars" viewBox="0 0 ${W} 220" width="100%" role="img" aria-label="รายได้และกำไรสุทธิ 5 ปีของ ${ipo.ticker}">`;
  s += row(f.revenue, 18, 60, 'รายได้', false) + row(f.profit, 112, 60, 'กำไรสุทธิ', true);
  const colW = (W - 60) / f.labels.length;
  f.labels.forEach((l, i) => { s += `<text x="${60 + i * colW + colW / 2}" y="214" font-size="11" text-anchor="middle">${l}</text>`; });
  return s + '</svg>';
}

function profitBars(ipo){
  const f = ipo.fin, v = f.profit, W = 330, H = 200, top = 34, h = 120, max = Math.max(...v) * 1.1, colW = (W - 20) / v.length;
  let o = `<svg class="bars" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${ipo.fin.title || 'กำไรสุทธิ'}ของ ${ipo.ticker}"><defs><pattern id="est-${ipo.id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--slate-soft)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--slate)" stroke-width="2.4"/></pattern></defs>`;
  o += `<line x1="0" x2="${W}" y1="${top + h}" y2="${top + h}" stroke="var(--line)"/>`;
  v.forEach((x, i) => {
    const w = Math.min(colW * 0.56, 64), bh = x / max * h, bx = 10 + i * colW + (colW - w) / 2, y = top + h - bh, est = (f.est || []).includes(i);
    const grow = i ? Math.round((x / v[i - 1] - 1) * 1000) / 10 : null;
    o += `<rect x="${bx}" y="${y}" width="${w}" height="${bh}" rx="4" fill="${est ? `url(#est-${ipo.id})` : grow !== null && grow < 0 ? 'var(--crit)' : 'var(--slate)'}"/>`;
    o += `<text class="v num" x="${bx + w / 2}" y="${y - 8}" font-size="12" text-anchor="middle">${est ? '≈' : ''}${fmt(x)}</text>`;
    o += `<text x="${bx + w / 2}" y="${top + h + 18}" font-size="12" text-anchor="middle">${f.labels[i]}</text>`;
    if (grow !== null) o += `<text x="${bx + w / 2}" y="${top + h + 34}" font-size="11.5" text-anchor="middle" style="fill:${grow < 0 ? 'var(--crit)' : 'var(--good)'};font-weight:600">${grow > 0 ? '+' : ''}${grow}%</text>`;
  });
  return o + '</svg>';
}

/* ================= AI =================
   On claude.ai the page uses Claude through claude.use('sample').
   Anywhere else (GitHub Pages, your laptop) it calls AI_ENDPOINT: your own Cloudflare Worker,
   which holds the free Gemini API key. Never put an API key in this file: the repo is public. */
const AI_ENDPOINT = ''; // เช่น 'https://owly-ai.<ชื่อของคุณ>.workers.dev'

function workerSampler(endpoint){
  const call = async (input, opts = {}) => {
    const messages = typeof input === 'string' ? [{role:'user', content:input}] : input;
    const res = await fetch(endpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({messages, json:!!opts.json}), signal:opts.signal});
    if (res.status === 429) throw {code:'rate_limited', message:'rate limited'};
    if (!res.ok) throw {code:'error', message:'HTTP ' + res.status};
    const data = await res.json();
    const text = data.text || '';
    if (opts.onText) opts.onText({text, delta:text});
    return {text, truncated:false};
  };
  const fn = (input, opts) => call(input, opts);
  fn.json = async (input, opts = {}) => {
    const r = await call(input, {...opts, json:true});
    const t = r.text.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
    return JSON.parse(t);
  };
  return fn;
}
/* Free AI with no key and no sign-up: Pollinations.ai (OpenAI-compatible endpoint).
   Used when the page is not on claude.ai and no AI_ENDPOINT is set. The free tier is rate limited,
   so calls are spaced out and a 429 shows a "wait a moment" message. Only the card data and the
   user's question are sent: the AI tab tells users not to type personal information. */
const FREE_AI = 'https://text.pollinations.ai/openai';
function freeSampler(){
  let last = 0;
  const call = async (input, opts = {}) => {
    const messages = typeof input === 'string' ? [{role:'user', content:input}] : input;
    const wait = Math.max(0, last + 5000 - Date.now());
    if (wait) await new Promise(r => setTimeout(r, wait));
    last = Date.now();
    const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 45000);
    let res;
    try {
      res = await fetch(FREE_AI, {method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({model:'openai', messages}), signal:ac.signal});
    } catch(e){ throw {code:'error', message:String(e)}; }
    finally { clearTimeout(timer); }
    if (res.status === 429) throw {code:'rate_limited', message:'rate limited'};
    if (!res.ok) throw {code:'error', message:'HTTP ' + res.status};
    const data = await res.json();
    const text = String((data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '').trim();
    if (!text) throw {code:'error', message:'empty reply'};
    if (opts.onText) opts.onText({text, delta:text});
    return {text, truncated:false};
  };
  const fn = (input, opts) => call(input, opts);
  fn.json = async (input, opts = {}) => {
    const r = await call(input, {...opts, json:true});
    const m = r.text.replace(/```(?:json)?/gi, '').match(/\{[\s\S]*\}/);
    return JSON.parse(m ? m[0] : r.text);
  };
  fn.provider = 'Pollinations.ai';
  return fn;
}

async function gask(q){
  if (gBusy) return;

  gchat.push({role:'user', content:q}); gRender(); document.getElementById('ginput').focus();
  const bubble = document.createElement('div'); bubble.className = 'bubble ai'; bubble.textContent = 'น้องฮูกกำลังดูข้อมูลในแอป...';
  logEl.appendChild(bubble); logEl.scrollTop = logEl.scrollHeight; status.textContent = '';
  const done = (text, note) => { bubble.textContent = text; gchat.push({role:'assistant', content:text}); status.textContent = note || ''; logEl.scrollTop = logEl.scrollHeight; gBusy = false; };
  try {
    const sample = await getSampler();
    if (!sample){ const a = gLocal(q); if (a) return done(a, 'คำตอบจากข้อมูลในแอป (โหมดออฟไลน์)'); return done('โหมดออฟไลน์ตอบได้เฉพาะเรื่องกองทุนที่เปิดขาย Term Fund หรือชื่อหุ้นและกองทุน เช่น KBANK', ''); }
    const msgs = [{role:'user', content:gsys() + '\n\nคำถามแรก: ' + gchat[0].content}];
    for (let i = 1; i < gchat.length; i++) msgs.push({role:gchat[i].role, content:gchat[i].content});
    const res = await sample(msgs, {cache:false, modelTier:'quick', onText:({text}) => { bubble.textContent = text; logEl.scrollTop = logEl.scrollHeight; }});
    done(res.text, sample.provider ? 'ตอบโดย AI ฟรีจาก ' + sample.provider + ' อย่าพิมพ์ข้อมูลส่วนตัว' : '');
  } catch(e){
    const a = gLocal(q);
    if (a) done(a, e && e.code === 'rate_limited' ? 'AI ฟรีจำกัดจำนวนครั้ง จึงตอบจากข้อมูลในแอปแทน' : 'แสดงคำตอบจากข้อมูลในแอปแทน');
    else { bubble.remove(); gchat.pop(); status.textContent = e && e.code === 'rate_limited' ? 'AI ฟรีจำกัดจำนวนครั้ง รอราว 15 วินาทีแล้วลองใหม่' : 'ตอนนี้ AI ตอบไม่ได้ ลองกดคำถามแนะนำ'; gBusy = false; gRender(); }
  }
}

}
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  const i = stepIndex();
  if (e.key === 'ArrowRight' && i < STEPS.length - 1) go({...STEPS[i + 1].go});
  if (e.key === 'ArrowLeft' && i > 0) go({...STEPS[i - 1].go});
});
rerender();
</script>
</body>
</html>
