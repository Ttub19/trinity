<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPO Lens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: presenter notes on the left, a working phone on the right. Below 900px the phone frame drops away and the app fills the screen.
   One memorable element: the six-segment lens ring that shows, at a glance, how many warning signs an IPO carries. */
:root{
  --stage:#E9EDF2; --paper:#F5F7FA; --surface:#FFFFFF; --ink:#142033; --muted:#5A6679; --line:#DCE2EA;
  --lens:#0B6F79; --lens-soft:#DDEFF0;
  --warn:#A8640E; --warn-soft:#FBEED6; --crit:#B3352F; --crit-soft:#F8E0DE; --good:#2A7A4D; --good-soft:#DEF0E5; --na:#9AA5B4;
  --frame:#1B2433;
  --display:'Bai Jamjuree','IBM Plex Sans Thai','Noto Sans Thai',sans-serif;
  --body:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --stage:#0B111B; --paper:#111A27; --surface:#18233A; --ink:#E6ECF4; --muted:#9BA9BC; --line:#2A3852;
    --lens:#4BBAC4; --lens-soft:#123A40;
    --warn:#E3A44C; --warn-soft:#3A2C14; --crit:#EA766E; --crit-soft:#3E1D1B; --good:#63C58F; --good-soft:#15331F; --na:#5E6B7E;
    --frame:#000; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --stage:#0B111B; --paper:#111A27; --surface:#18233A; --ink:#E6ECF4; --muted:#9BA9BC; --line:#2A3852;
  --lens:#4BBAC4; --lens-soft:#123A40;
  --warn:#E3A44C; --warn-soft:#3A2C14; --crit:#EA766E; --crit-soft:#3E1D1B; --good:#63C58F; --good-soft:#15331F; --na:#5E6B7E;
  --frame:#000; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
a{color:var(--lens)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lens);outline-offset:2px;border-radius:6px}
[hidden]{display:none !important}

/* ---------- stage ---------- */
.stage{--ph:min(812px, calc(100vh - 40px));min-height:100%;display:grid;grid-template-columns:minmax(260px,420px) auto;gap:clamp(20px,4vw,56px);justify-content:center;align-items:center;padding:20px clamp(16px,3vw,32px)}
@supports (height:100dvh){.stage{--ph:min(812px, calc(100dvh - 40px))}}
.notes{display:flex;flex-direction:column;gap:20px;max-width:420px}
.notes .kicker{font-size:13.5px;color:var(--muted)}
.notes h1{font-size:clamp(26px,3vw,34px);font-weight:700;display:flex;align-items:center;gap:10px}
.notes .pitch{margin:0;font-size:16px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps button{width:100%;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;color:var(--muted)}
.steps button:hover{background:var(--surface)}
.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:13px;border:1.5px solid var(--line)}
.steps button[aria-current="step"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.steps button[aria-current="step"] .n{background:var(--lens);border-color:var(--lens);color:#fff}
.notecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:10px}
.notecard h2{font-size:18px;font-weight:600}
.notecard ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14.5px}
.crit-tags{display:flex;gap:6px;flex-wrap:wrap}
.crit-tags span{font-size:12.5px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--lens-soft);color:var(--lens)}
.stage-foot{font-size:12.5px;color:var(--muted);margin:0}

.phone{height:var(--ph);width:calc(var(--ph) * 0.48);border-radius:calc(var(--ph) * 0.064);background:var(--frame);padding:calc(var(--ph) * 0.0148);box-shadow:0 30px 60px -20px rgba(15,25,45,.45);flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:calc(var(--ph) * 0.05);overflow:hidden;background:var(--paper);display:flex;flex-direction:column}
.statusbar{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600;font-family:var(--display)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:var(--frame)}
#app{flex:1;overflow-y:auto;overscroll-behavior:contain}
/* tablets in portrait: notes get narrower, phone keeps its frame */
@media (max-width:900px) and (min-width:720px){
  .stage{grid-template-columns:minmax(240px,1fr) auto}
  .notes{gap:14px}
  .notes .pitch{font-size:15px}
  .notecard ul{font-size:13.5px}
}
/* phones, small windows and short landscape screens: the app fills the screen */
@media (max-width:719px), (max-height:600px){
  html,body{background:var(--paper)}
  .stage{display:block;padding:0;min-height:0}
  .notes{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none;background:var(--paper)}
  .screen{border-radius:0;height:100%;max-width:600px;margin:0 auto;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .notch,.statusbar{display:none}
  .tabbar{padding-bottom:max(12px, env(safe-area-inset-bottom))}
}
@media (max-width:719px) and (min-width:601px), (max-height:600px) and (min-width:601px){
  .phone{background:var(--stage)}
  .screen{border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

/* ---------- app ---------- */
.pad{padding:0 18px}
.appbar{display:flex;align-items:center;gap:10px;padding:6px 18px 12px}
.appbar h1{font-size:22px;font-weight:700}
.appbar .sub{font-size:13px;color:var(--muted)}
.back{border:0;background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.fact{margin:0 18px 16px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.fact b{font-family:var(--display);font-size:20px;color:var(--crit);display:block;line-height:1.2}
.fact small{color:var(--muted);font-size:12.5px}
.sec-title{font-size:14px;font-weight:600;color:var(--muted);margin:18px 18px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec-title em{font-style:normal;font-weight:400;font-size:12.5px}
.rows{display:grid;gap:8px;padding:0 18px}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--lens)}
.row .t{font-weight:600;display:block}
.row .m{font-size:12.5px;color:var(--muted)}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.c-crit{background:var(--crit-soft);color:var(--crit)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-good{background:var(--good-soft);color:var(--good)} .c-info{background:var(--lens-soft);color:var(--lens)}

.ipohead{padding:4px 18px 14px;display:grid;gap:4px}
.ipohead h2{font-size:22px;font-weight:700}
.ipohead .m{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kv span{display:block;font-size:11.5px;color:var(--muted)}
.kv b{font-family:var(--display);font-size:16px;font-weight:600}

.seg{position:sticky;top:0;z-index:2;background:var(--paper);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 18px;border-bottom:1px solid var(--line)}
.seg button{border:0;background:transparent;padding:7px 0;border-radius:9px;cursor:pointer;font-size:13.5px;color:var(--muted);font-weight:500}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tab{padding:16px 18px 28px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h3{font-size:15.5px;font-weight:600;margin-bottom:6px}
.card p{margin:0;font-size:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}

.lensbox{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.ring text{font-family:var(--display)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12.5px}
.legend li{display:flex;gap:6px;align-items:flex-start}
.legend i{flex:none;width:9px;height:9px;border-radius:3px;margin-top:5px}
.legend .s-na{color:var(--muted)}
.i-crit{background:var(--crit)} .i-warn{background:var(--warn)} .i-ok{background:var(--good)} .i-na{background:var(--na)}

.outcome{border-left:4px solid var(--crit);background:var(--surface);border-radius:12px;padding:12px 14px;border:1px solid var(--line);border-left-width:4px}
.outcome h3{font-size:15px}
.outcome ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;display:grid;gap:4px}

.sig{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:12px;padding:10px 12px;background:var(--surface)}
.sig.crit{border-left-color:var(--crit)}
.sig b{display:block;font-size:14.5px}
.sig p{margin:3px 0 6px;font-size:13.5px}
.srcbtn{border:0;background:var(--lens-soft);color:var(--lens);font-size:12px;padding:2px 10px;border-radius:999px;cursor:pointer}
.srcnote{font-size:12.5px;color:var(--muted);margin-top:6px}
.list{margin:0;padding-left:18px;display:grid;gap:5px;font-size:13.5px}

.bars text{font-family:var(--body);fill:var(--muted)}
.bars .v{fill:var(--ink);font-weight:600}
.metric{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.metric:last-child{border-bottom:0}
.metric b{font-family:var(--display);font-weight:600}
.pe-row{display:grid;grid-template-columns:96px 1fr 52px;gap:8px;align-items:center;font-size:13px;margin-top:6px}
.pe-bar{height:12px;border-radius:6px;background:var(--line)}
.pe-bar.me{background:var(--lens)}

.claim{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:grid;gap:8px}
.claim-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.claim-top b{font-size:14px}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%}
.claim .why{font-size:12.5px;color:var(--muted)}
.srcs{display:flex;flex-wrap:wrap;gap:6px}
.srcs a{font-size:11.5px;text-decoration:none;padding:2px 8px;border-radius:8px;border:1px solid var(--line);color:var(--ink)}
.srcs a.agree{border-color:var(--good);color:var(--good)}
.srcs a.disagree{border-color:var(--crit);color:var(--crit)}
.srcs a.copy{border-style:dashed;color:var(--muted)}
.rule{font-size:12.5px;background:var(--lens-soft);border-radius:12px;padding:10px 12px}

.chat{display:grid;gap:10px}
.bubble{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap}
.bubble.me{justify-self:end;background:var(--lens);color:#fff;border-bottom-right-radius:4px}
.bubble.ai{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.suggest{display:flex;flex-wrap:wrap;gap:6px}
.suggest button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.composer{display:grid;grid-template-columns:1fr auto;gap:8px}
.composer input,textarea{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
.btn{border:0;background:var(--lens);color:#fff;border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.offline{font-size:12px;color:var(--muted)}
.disclaimer{font-size:11.5px;color:var(--muted);padding:0 18px 20px;margin:0}
/* ---------- tab bar + reels ---------- */
.tabbar{flex:none;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);background:var(--surface);padding:6px 10px 16px}
.tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer;padding:4px}
.tabbar button[aria-current="page"]{color:var(--lens);font-weight:600}
.screen.dark{background:#0B1422}
.screen.dark .statusbar{color:#fff}
.screen.dark #app{overflow:hidden}
.screen.dark .tabbar{background:#0B1422;border-color:#1E2A3D}
.screen.dark .tabbar button{color:#8FA1B5}
.screen.dark .tabbar button[aria-current="page"]{color:#5FD0DA}
.reels{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;background:#0B1422;--crit:#EF7A72;--warn:#F0B055;--good:#6FD39B;--na:#45556B;--ink:#F2F6FA;--muted:#9FB0C3}
.reel{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;color:#F2F6FA;background:#0F1B2D;cursor:pointer;user-select:none}
.reel + .reel{border-top:1px solid #1E2A3D}
.progress{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px;z-index:3}
.progress span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:#fff}
.scene{position:absolute;inset:0;padding:56px 24px 112px;display:flex;flex-direction:column;justify-content:center;gap:14px;opacity:0;transition:opacity .35s ease}
.scene.on{opacity:1}
.scene h2{font-size:32px;line-height:1.2;font-weight:700;color:#F2F6FA}
.scene .sub{font-size:16px;color:#B8C6D6;margin:0}
.scene .src{font-size:12px;color:#8FA1B5;margin:4px 0 0}
.reel-art{display:block;width:100%;max-width:310px;height:auto;border-radius:16px;box-shadow:0 12px 28px -12px rgba(0,0,0,.6)}
.big{font-family:var(--display);font-size:80px;font-weight:700;line-height:1;color:#5FD0DA}
.big.red{color:#F08A82}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#2A3A52}
.split i{display:block;width:0;background:#F08A82;transition:width 1.2s ease .3s}
.scene.on .split i{width:var(--w)}
.splitlab{display:flex;justify-content:space-between;font-size:12.5px;color:#B8C6D6}
.dots{display:grid;grid-template-columns:repeat(5,30px);gap:10px}
.dots i{width:30px;height:30px;border-radius:50%;background:#2A3A52;transition:background .3s ease}
.scene.on .dots i.hit{background:#F08A82}
.cmp2{display:flex;align-items:baseline;gap:14px;font-family:var(--display);flex-wrap:wrap}
.cmp2 .from{font-size:40px;color:#9FB0C3;font-weight:600}
.cmp2 .to{font-size:60px;color:#F08A82;font-weight:700}
.cmp2 small{display:block;font-family:var(--body);font-size:12.5px;color:#8FA1B5;font-weight:400}
.reelchecks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.reelchecks li{display:flex;gap:10px;align-items:center;font-size:16px;opacity:0;transform:translateY(6px);transition:opacity .3s ease,transform .3s ease}
.scene.on .reelchecks li{opacity:1;transform:none}
.reelchecks i{width:10px;height:10px;border-radius:3px;background:#5FD0DA;flex:none}
.reel .ring circle{opacity:0;transition:opacity .25s ease}
.scene.on .ring circle{opacity:1}
.reel .ring text{fill:#F2F6FA}
.reel .ring tspan{fill:#9FB0C3}
.reelqs{margin:0;padding-left:22px;display:grid;gap:8px;font-size:16px}
.cta{justify-self:start;align-self:flex-start;border:0;background:#5FD0DA;color:#0B1422;font-weight:600;border-radius:12px;padding:10px 16px;cursor:pointer}
.reel-meta{position:absolute;left:16px;right:76px;bottom:16px;z-index:3}
.reel-meta b{font-family:var(--display);font-size:16px}
.reel-meta .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;margin-left:6px;background:rgba(255,255,255,.14);color:#DDE6EF;vertical-align:2px}
.reel-meta small{display:block;font-size:11.5px;color:#9FB0C3;margin-top:2px}
.reel-side{position:absolute;right:12px;bottom:18px;z-index:3;display:grid;gap:4px;justify-items:center}
.reel-side button{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}
.reel-side span{font-size:11px;color:#C9D5E2;margin-bottom:8px}
.pausemark{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:6px 14px;font-size:13px;pointer-events:none}
.reelhint{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:11.5px;color:#8FA1B5;z-index:3;pointer-events:none}
.promo{margin:0 18px 4px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#0F1B2D;color:#F2F6FA;border:0;border-radius:14px;padding:12px 14px;cursor:pointer;text-align:left;width:calc(100% - 36px)}
.promo b{font-family:var(--display);display:block}
.promo span{font-size:12.5px;color:#B8C6D6}
.promo .play{width:36px;height:36px;border-radius:50%;background:#5FD0DA;display:grid;place-items:center;color:#0B1422}
.ghostbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;cursor:pointer;font-weight:500;color:var(--lens);display:inline-flex;gap:8px;align-items:center}
/* ---------- anchor reels (น้องฮูก) ---------- */
.reel.anchor{background:#0B1626}
.studio{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.owlbox{position:relative;width:min(66%,250px)}
.owlbox .owlwrap{width:100%}
.desk{position:absolute;left:-30%;right:-30%;bottom:-34px;pointer-events:none}
.desk svg{display:block;width:100%;height:auto}
.ticker{position:absolute;top:40px;left:0;right:0;height:26px;z-index:3;background:rgba(95,208,218,.12);border-top:1px solid rgba(95,208,218,.25);border-bottom:1px solid rgba(95,208,218,.25);overflow:hidden;pointer-events:none;display:flex;align-items:center}
.ticker .tag0{flex:none;height:100%;display:flex;align-items:center;padding:0 10px;background:#5FD0DA;color:#0B1422;font-size:11.5px;font-weight:700;font-family:var(--display);position:relative;z-index:1}
.ticker .run{display:flex;gap:28px;white-space:nowrap;font-size:12px;color:#DDE6EF;padding-left:14px}
.ticker .run b{font-weight:600}
.ticker .ok{color:#6FD39B} .ticker .no{color:#F0B055} .ticker .bad{color:#EF7A72}
@media (prefers-reduced-motion: no-preference){ .ticker .run{animation:ticker 26s linear infinite} @keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}} }
.ai-label{position:absolute;top:72px;right:12px;z-index:3;font-size:11px;padding:2px 9px;border-radius:999px;background:rgba(95,208,218,.16);color:#9FE3E9;pointer-events:none}
.anchor-stage{position:absolute;left:0;right:0;top:78px;display:grid;justify-items:center;gap:6px;pointer-events:none}
.owlwrap{width:100%}
.owlwrap svg{display:block;width:100%;height:auto;overflow:visible}
.anchor-name{font-size:12px;color:#9FB0C3;margin-top:40px;position:relative}
.owl .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}
.owl .brow{transform-box:view-box;transition:transform .35s ease}
.owl .pupil{transition:transform .35s ease}
.owl .jaw{transform-box:view-box;transition:transform .08s linear}
.owl .brow-l{transform-origin:50px 60px}
.owl .brow-r{transform-origin:150px 60px}
.mood-concerned .brow-l{transform:rotate(-14deg)}
.mood-concerned .brow-r{transform:rotate(14deg)}
.mood-concerned .pupil{transform:translateY(-3px)}

const outletOf = id => SRC[id].outlet;
function scoreClaim(c){
  const indep = new Set(c.topicSources.filter(id => !c.copies.includes(id)).map(outletOf));
  const agreeOut = new Set(c.agree.filter(id => !c.copies.includes(id)).map(outletOf));
  const disOut = new Set(c.disagree.map(outletOf));
  const n = new Set([...agreeOut, ...disOut]).size || indep.size;
  const pct = n ? Math.round(agreeOut.size / n * 100) : 0;
  let verdict, cls;
  if (c.pr && indep.size < 2){ verdict = 'ยืนยันไม่ได้ มาจากบริษัทเอง'; cls = 'c-warn'; }
  else if (n < 2){ verdict = 'มีแหล่งเดียว ยังไม่พอยืนยัน'; cls = 'c-warn'; }
  else if (pct >= 80){ verdict = 'น่าเชื่อถือ'; cls = 'c-good'; }
  else { verdict = 'ข้อมูลยังขัดกัน'; cls = 'c-crit'; }
  return {n, pct, verdict, cls};
}

/* ---------- voice (device text-to-speech, Thai) ---------- */
const voice = {supported:'speechSynthesis' in window, unlocked:false, muted:false, th:null, listed:false};
function pickVoice(){
  if (!voice.supported) return;
  const v = speechSynthesis.getVoices();
  if (v.length) voice.listed = true;
  voice.th = v.find(x => /^th/i.test(x.lang)) || null;
}
if (voice.supported){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const canSpeakThai = () => voice.supported && !voice.muted && (voice.th || !voice.listed);
function lineChip(line){
  if (line.claim){ const c = CLAIMS.find(x => x.id === line.claim), r = scoreClaim(c); return {label:r.verdict, cls:r.cls, sub:`ตรวจข่าว: ${c.text} (ตรงกัน ${r.pct}% จาก ${r.n} แหล่ง)`}; }
  return line.chip || null;
}
function anchorEl(i){ return reelEl(i); }
function anchorShow(i, k, ms){
  const el = anchorEl(i), r = REELS[i], line = r.lines[k]; if (!el || !line) return;
  const wrap = el.querySelector('.owlwrap');
  wrap.className = 'owlwrap mood-' + (line.mood || 'neutral');
  el.querySelector('.subtitle').textContent = line.text;
  const ch = lineChip(line), low = el.querySelector('.lower');
  if (ch){ low.hidden = false; low.innerHTML = `<span class="chip ${ch.cls}">${esc(ch.label)}</span><span class="lbl">${esc(ch.sub)}</span>`; } else { low.hidden = true; low.innerHTML = ''; }
  el.querySelectorAll('.progress i').forEach((b, n) => {
    b.style.transition = 'none';
    b.style.width = n < k ? '100%' : '0%';
    if (n === k){ void b.offsetWidth; b.style.transition = `width ${ms}ms linear`; b.style.width = '100%'; }
  });
}
function talking(i, on){ const w = anchorEl(i) && anchorEl(i).querySelector('.owlwrap'); if (w) w.classList.toggle('talking', on); }
function anchorPlay(i, k){
  const r = REELS[i]; if (!r || k >= r.lines.length){ player.running = false; talking(i, false); const el = anchorEl(i); if (el){ el.querySelector('.tapstart').hidden = false; el.querySelector('.tapstart span').textContent = 'ฟังอีกครั้ง'; } return; }
  const token = ++player.token; player.line = k; player.running = true;
  const text = r.lines[k].text, est = Math.max(2200, text.length * 85);
  anchorShow(i, k, est);
  const done = () => { if (token !== player.token) return; talking(i, false); setTimeout(() => { if (token === player.token) anchorPlay(i, k + 1); }, 380); };
  const el = anchorEl(i), note = el.querySelector('.voicenote');
  if (canSpeakThai()){
    note.hidden = true;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'th-TH'; if (voice.th) u.voice = voice.th; u.rate = 1; u.pitch = 1.05;
    let started = false;
    u.onstart = () => { started = true; talking(i, true); };
    u.onend = done;
    u.onerror = () => { if (token !== player.token) return; talking(i, true); setTimeout(done, est); };
    speechSynthesis.speak(u);
    setTimeout(() => { if (token === player.token && !started){ talking(i, true); setTimeout(done, est); } }, 1500);
  } else {
    note.hidden = false;
    note.textContent = voice.muted ? 'ปิดเสียงอยู่ แสดงซับแทน' : 'เครื่องนี้ไม่มีเสียงภาษาไทย แสดงซับแทน';
    talking(i, true);
    setTimeout(done, est);
  }
}
function anchorStop(){ player.token++; player.running = false; if (voice.supported) speechSynthesis.cancel(); talking(player.reel, false); }
function anchorReset(i){
  const el = anchorEl(i); if (!el) return;
  anchorShow(i, 0, 0);
  el.querySelectorAll('.progress i').forEach(b => { b.style.transition = 'none'; b.style.width = '0%'; });
  const tap = el.querySelector('.tapstart');
  if (voice.unlocked){ tap.hidden = true; anchorPlay(i, 0); }
  else { tap.hidden = false; tap.querySelector('span').textContent = 'แตะเพื่อฟังน้องฮูก'; }
}
async function rewriteWithAI(i, btn){

    const ok = v && Array.isArray(v.lines) && v.lines.length >= 3 && v.lines.length <= 8 && v.lines.every(l => typeof l.text === 'string' && l.text.length > 0 && l.text.length <= 160);

function reelEl(i){ return document.querySelector(`.reel[data-reel="${i}"]`); }
function paint(){
  const el = reelEl(player.reel); if (!el || REELS[player.reel].type === 'anchor') return;
  el.querySelectorAll('.scene').forEach((s, k) => {
    const was = s.classList.contains('on'), now = k === player.scene;
    s.classList.toggle('on', now);
    if (now && !was) countUp(s);
  });
  el.querySelectorAll('.progress i').forEach((b, k) => {
    b.style.width = k < player.scene ? '100%' : k > player.scene ? '0%' : Math.min(100, player.t / SCENE_MS * 100) + '%';
  });
  el.querySelector('.pausemark').hidden = !player.paused;
}
function countUp(sceneEl){
  sceneEl.querySelectorAll('[data-count]').forEach(n => {
    const end = +n.dataset.count, suf = n.dataset.suffix || '', t0 = performance.now();
    if (matchMedia('(prefers-reduced-motion: reduce)').matches){ n.textContent = end + suf; return; }
    const step = now => { const p = Math.min(1, (now - t0) / 900); n.textContent = Math.round(end * p) + suf; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function startReel(i){
  clearInterval(player.timer);
  anchorStop();
  if (REELS[i].type === 'anchor'){ player.reel = i; state.reel = i; anchorReset(i); return; }
  if (player.reel !== i){ const old = reelEl(player.reel); if (old) old.querySelectorAll('.scene').forEach((s, k) => s.classList.toggle('on', k === 0)); }
  Object.assign(player, {reel:i, scene:0, t:0, paused:false, ended:false});
  state.reel = i;
  const el = reelEl(i); if (el) el.querySelectorAll('.scene').forEach(s => s.classList.remove('on'));
  paint();
  player.timer = setInterval(tick, 50);
}
function tick(){
  if (player.paused || player.ended) return;
  player.t += 50;
  if (player.t >= SCENE_MS){
    const n = REELS[player.reel].scenes.length;
    if (player.scene < n - 1){ player.scene++; player.t = 0; }
    else { player.t = SCENE_MS; player.ended = true; }
  }
  paint();
}
function stopPlayer(){ clearInterval(player.timer); anchorStop(); if (player.io) player.io.disconnect(); player.io = null; }
function bindReels(){
  const box = document.getElementById('reels'); if (!box) return;
  box.scrollTop = (state.reel || 0) * box.clientHeight;
  player.io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) startReel(+e.target.dataset.reel); }), {root:box, threshold:0.6});
  box.querySelectorAll('.reel').forEach(r => player.io.observe(r));
  box.querySelectorAll('[data-tapstart]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.tapstart; voice.unlocked = true; b.hidden = true;
    if (voice.supported){ try { speechSynthesis.cancel(); speechSynthesis.resume(); } catch(e){} }
    const from = b.dataset.resume ? +b.dataset.resume : 0; delete b.dataset.resume;
    player.reel = i; anchorPlay(i, from);
  }));
  box.querySelectorAll('[data-mute]').forEach(b => b.addEventListener('click', () => {
    voice.muted = !voice.muted;
    box.querySelectorAll('[data-mute]').forEach(x => { x.setAttribute('aria-pressed', String(voice.muted)); x.classList.toggle('on', voice.muted); });
    if (player.running){ const i = player.reel, k = player.line; anchorStop(); anchorPlay(i, k); }
  }));
  box.querySelectorAll('[data-rewrite]').forEach(b => b.addEventListener('click', () => rewriteWithAI(+b.dataset.rewrite, b)));
  box.querySelectorAll('.reel').forEach(r => r.addEventListener('click', e => {
    if (e.target.closest('button,a')) return;
    const i = +r.dataset.reel; if (i !== player.reel) return;
    if (REELS[i].type === 'anchor'){
      if (!voice.unlocked) return;
      const x = (e.clientX - r.getBoundingClientRect().left) / r.clientWidth, n = REELS[i].lines.length;
      if (x < 0.3){ anchorStop(); anchorPlay(i, Math.max(0, player.line - 1)); }
      else if (x > 0.7){ anchorStop(); anchorPlay(i, Math.min(n - 1, player.line + 1)); }
      else if (player.running){ anchorStop(); const tap = r.querySelector('.tapstart'); tap.hidden = false; tap.querySelector('span').textContent = 'ฟังต่อ'; tap.dataset.resume = player.line; }
      return;
    }
    const x = (e.clientX - r.getBoundingClientRect().left) / r.clientWidth, n = REELS[i].scenes.length;
    if (x < 0.3){ player.scene = Math.max(0, player.scene - 1); player.t = 0; player.ended = false; }
    else if (x > 0.7){ if (player.scene < n - 1){ player.scene++; player.t = 0; } }
    else if (player.ended){ startReel(i); return; }
    else player.paused = !player.paused;
    paint();
  }));
  box.querySelectorAll('[data-opencard]').forEach(b => b.addEventListener('click', () => go({screen:'ipo', ipo:b.dataset.opencard, tab:'summary'})));
}

/* ================= pieces ================= */
function ring(ipo, size){
  const r = size * 0.38, c = size / 2, C = 2 * Math.PI * r, seg = C / 6, gap = size > 60 ? 6 : 4;
  const col = {crit:'var(--crit)', warn:'var(--warn)', ok:'var(--good)', na:'var(--na)'};
  const found = CHECKS.filter(k => ['crit','warn'].includes(ipo.checks[k.key])).length;
  let s = `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="พบสัญญาณเตือน ${found} จาก 6 เรื่อง">`;
  CHECKS.forEach((k, i) => {
    s += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col[ipo.checks[k.key]]}" stroke-width="${size * 0.11}" stroke-dasharray="${seg - gap} ${C - seg + gap}" stroke-dashoffset="${-i * seg}" transform="rotate(-90 ${c} ${c})" stroke-linecap="butt"/>`;
  });
  s += `<text x="${c}" y="${c + size * 0.08}" text-anchor="middle" font-size="${size * 0.26}" font-weight="700" fill="var(--ink)">${found}<tspan font-size="${size * 0.14}" fill="var(--muted)">/6</tspan></text></svg>`;
  return s;
}
function foundCount(ipo){ return CHECKS.filter(k => ['crit','warn'].includes(ipo.checks[k.key])).length; }
function levelChip(ipo){
  const n = foundCount(ipo), crit = Object.values(ipo.checks).includes('crit');
  return `<span class="chip ${n === 0 ? 'c-good' : crit ? 'c-crit' : 'c-warn'}">${n ? 'พบ ' + n + ' สัญญาณ' : 'ไม่พบสัญญาณ'}</span>`;
}

function bars(ipo){
  const f = ipo.fin, W = 330;
  if (f.kind === 'quarters'){
    const vals = f.profit, max = Math.max(...vals), min = Math.min(...vals, 0), span = max - min, h = 130, top = 26;
    const base = top + h * (max / span), colW = (W - 10) / vals.length;
    let s = `<svg class="bars" viewBox="0 0 ${W} 200" width="100%" role="img" aria-label="กำไรสุทธิรายไตรมาสของ ${ipo.ticker}">`;
    s += `<defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--muted)" stroke-width="2"/></pattern></defs>`;
    s += `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
    vals.forEach((v, i) => {
      const x = 5 + i * colW + colW * 0.2, w = colW * 0.6, bh = Math.max(Math.abs(v) / span * h, 2), y = v >= 0 ? base - bh : base;
      const fill = i === f.after ? 'url(#hatch)' : i === f.hot ? 'var(--crit)' : v < 0 ? 'var(--na)' : 'var(--lens)';
      s += `<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="3" fill="${fill}"/>`;
      s += `<text class="v num" x="${x + w / 2}" y="${v >= 0 ? y - 5 : y + bh + 13}" font-size="11.5" text-anchor="middle">${fmt(v)}</text>`;
      s += `<text x="${x + w / 2}" y="194" font-size="11" text-anchor="middle">${f.labels[i]}</text>`;
    });
    return s + '</svg>';
  }
  const row = (vals, top, h, label, hotOn) => {
    const max = Math.max(...vals, 0), min = Math.min(...vals, 0), span = (max - min) || 1, base = top + h * (max / span), colW = (W - 60) / vals.length;
    let o = `<text x="0" y="${top + h / 2 + 4}" font-size="12" style="fill:var(--ink);font-weight:600">${label}</text><line x1="60" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
    vals.forEach((v, i) => {
      const x = 60 + i * colW + colW * 0.2, w = colW * 0.6, bh = Math.max(Math.abs(v) / span * h, 2), y = v >= 0 ? base - bh : base;
      const fill = hotOn && i === ipo.fin.hot ? 'var(--crit)' : v < 0 ? 'var(--na)' : 'var(--lens)';
      o += `<rect x="${x}" y="${y}" width="${w}" height="${bh}" rx="3" fill="${fill}"/><text class="v num" x="${x + w / 2}" y="${v >= 0 ? y - 4 : y + bh + 12}" font-size="11" text-anchor="middle">${fmt(v)}</text>`;
    });
    return o;
  };
  let s = `<svg class="bars" viewBox="0 0 ${W} 220" width="100%" role="img" aria-label="รายได้และกำไรสุทธิ 5 ปีของ ${ipo.ticker}">`;
  s += row(f.revenue, 18, 60, 'รายได้', false) + row(f.profit, 112, 60, 'กำไรสุทธิ', true);
  const colW = (W - 60) / f.labels.length;
  f.labels.forEach((l, i) => { s += `<text x="${60 + i * colW + colW / 2}" y="214" font-size="11" text-anchor="middle">${l}</text>`; });
  return s + '</svg>';
}

/* ================= AI =================
   On claude.ai the page uses Claude through claude.use('sample').
   Anywhere else (GitHub Pages, your laptop) it calls AI_ENDPOINT: your own Cloudflare Worker,
   which holds the free Gemini API key. Never put an API key in this file: the repo is public. */
const AI_ENDPOINT = ''; // เช่น 'https://ipo-lens-ai.<ชื่อของคุณ>.workers.dev'

function workerSampler(endpoint){
  const call = async (input, opts = {}) => {
    const messages = typeof input === 'string' ? [{role:'user', content:input}] : input;
    const res = await fetch(endpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({messages, json:!!opts.json}), signal:opts.signal});
    if (res.status === 429) throw {code:'rate_limited', message:'rate limited'};
    if (!res.ok) throw {code:'error', message:'HTTP ' + res.status};
    const data = await res.json();
    const text = data.text || '';
    if (opts.onText) opts.onText({text, delta:text});
    return {text, truncated:false};
  };
  const fn = (input, opts) => call(input, opts);
  fn.json = async (input, opts = {}) => {
    const r = await call(input, {...opts, json:true});
    const t = r.text.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
    return JSON.parse(t);
  };
  return fn;
}
let samplerP = null;
function getSampler(){
  if (!samplerP){
    const viaClaude = (window.claude && claude.use) ? claude.use('sample').catch(() => null) : Promise.resolve(null);
    samplerP = viaClaude.then(s => s || (AI_ENDPOINT ? workerSampler(AI_ENDPOINT) : null));
  }
  return samplerP;
}
function context(ipo){
  return JSON.stringify({
    ชื่อ:ipo.name, ตัวย่อ:ipo.ticker, ตลาด:ipo.market, ข้อมูลจริงหรือสมมติ:ipo.real ? 'จริง' : 'สมมติ', ราคาจอง:ipo.price, PE:ipo.pe, PEกลุ่ม:ipo.peerPe,
    สรุป:ipo.summary,
    การตรวจ6เรื่อง:CHECKS.map(k => ({เรื่อง:k.label, ผล:{crit:'พบ รุนแรง', warn:'พบ', ok:'ไม่พบ', na:'ไม่มีข้อมูล'}[ipo.checks[k.key]]})),
    สัญญาณ:ipo.signals.map(s => ({หัวข้อ:s.title, รายละเอียด:s.text, ที่มา:s.src})),
    จุดแข็ง:ipo.strengths, คำถามก่อนจอง:ipo.questions,

    ตัวเลขงบ:ipo.fin
  });

async function ask(ipo, q){
  const log = chats[ipo.id] = chats[ipo.id] || [];
  log.push({role:'user', content:q});
  rerender();
  const chatEl = document.getElementById('chatlog');
  const bubble = document.createElement('div'); bubble.className = 'bubble ai'; bubble.textContent = 'กำลังอ่านการ์ด...';
  chatEl.appendChild(bubble); scrollBottom();
  const status = document.getElementById('aistatus');
  const sample = await getSampler();
  if (!sample){
    const a = CANNED[q] || 'โหมดออฟไลน์ตอบได้เฉพาะคำถามแนะนำด้านบน เชื่อม AI ผ่าน AI_ENDPOINT หรือเปิดหน้านี้ใน claude.ai เพื่อถามคำถามอื่น';
    bubble.textContent = a; log.push({role:'assistant', content:a});
    status.textContent = 'คำตอบตัวอย่าง (โหมดออฟไลน์)'; return;
  }
  const sys = 'คุณคือผู้ช่วยในแอป IPO Lens ตอบเป็นภาษาไทย สั้น ไม่เกิน 5 บรรทัด ใช้เฉพาะข้อมูลใน JSON ด้านล่าง ห้ามเดาหรือใช้ความรู้ภายนอก ถ้าข้อมูลไม่มีให้บอกตรงๆ ว่าการ์ดไม่มีข้อมูลนี้ และแนะนำให้ถามบริษัทหรือผู้แนะนำการลงทุน ห้ามแนะนำให้ซื้อ ขาย หรือจอง ห้ามคาดการณ์ราคา ปิดท้ายด้วยบรรทัด "ที่มา:" ตามด้วยชื่อแหล่งข้อมูลที่ใช้ ถ้าเป็นข้อมูลสมมติให้บอกว่าเป็นข้อมูลสมมติ ห้ามใช้ markdown\n\nข้อมูลการ์ด:\n' + context(ipo);
  const msgs = [{role:'user', content:sys + '\n\nคำถามแรก: ' + log[0].content}];
  for (let i = 1; i < log.length; i++) msgs.push({role:log[i].role, content:log[i].content});
  try {
    const res = await sample(msgs, {cache:false, modelTier:'quick', onText:({text}) => { bubble.textContent = text; scrollBottom(); }});
    bubble.textContent = res.text; log.push({role:'assistant', content:res.text}); status.textContent = '';
  } catch(e){
    const a = CANNED[q];
    if (a){ bubble.textContent = a; log.push({role:'assistant', content:a}); }
    else { bubble.textContent = 'ตอนนี้ AI ตอบไม่ได้ ลองกดคำถามแนะนำด้านบน'; log.pop(); }
    status.textContent = e && e.code === 'rate_limited' ? 'ถามถี่เกินไป รอสักครู่แล้วลองใหม่' : e && e.code === 'not_granted' ? 'ยังไม่ได้อนุญาตให้หน้านี้ใช้ AI จึงแสดงคำตอบตัวอย่าง' : 'แสดงคำตอบตัวอย่างแทน';
  }
}

  if (!sample){ fallback(); btn.disabled = false; return; }
  try {
    const v = await sample.json('เทียบข้อความข่าวที่ผู้ใช้วางมา กับรายการข่าวที่ตรวจแล้วของหุ้น PHAT ตอบเป็น JSON เท่านั้นในรูปแบบ {"claimId": "id หรือ null", "match": "ตรงกัน|ขัดกัน|ไม่พบ", "reason": "เหตุผลภาษาไทยไม่เกิน 2 ประโยค"} ถ้าข้อความอ้างตัวเลขที่ไม่มีในรายการ ให้ match เป็น "ไม่พบ" และบอกว่ายังยืนยันไม่ได้\n\nรายการข่าวที่ตรวจแล้ว: ' + JSON.stringify(claims) + '\n\nข้อความที่ผู้ใช้วาง: ' + text, {modelTier:'quick', cache:false});
    const c = CLAIMS.find(x => x.id === v.claimId);
    const cls = v.match === 'ตรงกัน' ? 'c-good' : v.match === 'ขัดกัน' ? 'c-crit' : 'c-warn';
    out.innerHTML = `<span class="chip ${cls}">${esc(v.match || 'ไม่พบ')}</span> ${c ? 'เทียบกับ: <b>' + esc(c.text) + '</b> ' : ''}<div style="margin-top:4px">${esc(v.reason || '')}</div>`;
    st.textContent = '';
  } catch(e){ fallback(); }
  btn.disabled = false;
}

/* ================= render ================= */
function scrollBottom(){ const a = document.getElementById('app'); a.scrollTop = a.scrollHeight; }
function rerender(keepScroll){
  stopPlayer();
  const app = document.getElementById('app'), y = app.scrollTop;
  app.innerHTML = state.screen === 'home' ? home() : state.screen === 'reels' ? reelsScreen() : ipoScreen(IPOS[state.ipo]);
  app.scrollTop = keepScroll ? y : 0;
  document.querySelector('.screen').classList.toggle('dark', state.screen === 'reels');
  document.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', (b.dataset.nav === 'reels') === (state.screen === 'reels') ? 'page' : 'false'));
  bind(); notes();
  if (state.screen === 'reels') bindReels();
}
function go(next){ Object.assign(state, next); rerender(); }
function bind(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', () => go({screen:'ipo', ipo:b.dataset.open, tab:'summary'})));
  app.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => go({screen:'home'})));
  app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { state.tab = b.dataset.tab; const y = document.getElementById('app').scrollTop; rerender(); const hd = document.querySelector('.seg'); if (hd && y > hd.offsetTop) document.getElementById('app').scrollTop = hd.offsetTop; }));
  app.querySelectorAll('[data-src]').forEach(b => b.addEventListener('click', () => { const n = document.getElementById(b.getAttribute('aria-controls')); const open = b.getAttribute('aria-expanded') === 'true'; b.setAttribute('aria-expanded', String(!open)); n.hidden = open; }));
  const ipo = IPOS[state.ipo];
  app.querySelectorAll('[data-ask]').forEach(b => b.addEventListener('click', () => ask(ipo, b.dataset.ask)));
  const f = document.getElementById('askform');
  if (f) f.addEventListener('submit', e => { e.preventDefault(); const v = document.getElementById('askinput').value.trim(); if (v) ask(ipo, v); });
  const cn = document.getElementById('checknews');
  if (cn) cn.addEventListener('click', checkPasted);
  app.querySelectorAll('[data-reelof]').forEach(b => b.addEventListener('click', () => go({screen:'reels', reel:REELS.findIndex(r => r.id === b.dataset.reelof)})));
}
document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => go(b.dataset.nav === 'reels' ? {screen:'reels', reel:0} : {screen:'home'})));
function notes(){
  const i = stepIndex();
  document.getElementById('steps').innerHTML = STEPS.map((s, k) => `<li><button type="button" data-step="${k}" ${k === i ? 'aria-current="step"' : ''}><span class="n">${k + 1}</span><span>${s.label}</span></button></li>`).join('');
  document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => go({...STEPS[+b.dataset.step].go})));
  const n = NOTES[i];
  const ipo = IPOS[state.ipo];
  const extra = state.screen === 'ipo' && ipo && !ipo.real ? '<p class="small muted" style="margin:0">ตอนนี้กำลังดูบริษัทสมมติ กดขั้นที่ 2 เพื่อกลับไปที่ PHAT</p>' : '';
  document.getElementById('notecard').innerHTML = `<div class="crit-tags">${n.tags.map(t => `<span>${t}</span>`).join('')}</div><h2>${n.title}</h2><ul>${n.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul>${extra}`;
}
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  const i = stepIndex();
  if (e.key === 'ArrowRight' && i < STEPS.length - 1) go({...STEPS[i + 1].go});
  if (e.key === 'ArrowLeft' && i > 0) go({...STEPS[i - 1].go});
});
rerender();
</script>
</body>
