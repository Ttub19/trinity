<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Owly · อ่านหุ้นให้เข้าใจใน 1 นาที</title>
<meta name="description" content="Owly เริ่มจากแบรนด์ที่คุณใช้ทุกวัน แล้วแปลงบหุ้นเป็นภาษาคน ตรวจ 6 เรื่องก่อนตัดสินใจ ไม่ใช่คำแนะนำการลงทุน">
<meta name="theme-color" content="#1A1527" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15101F" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/ipo.css">
<link rel="stylesheet" href="css/reels.css">
<link rel="stylesheet" href="css/market-profile.css">

<body>
<div class="stage">
  <aside class="notes" aria-label="โน้ตสำหรับการนำเสนอ">
    <div>
      
      <div class="kicker">Future Finance Innovation Hackathon 2026 · Invest Like Gen Z</div>
      <h1 class="brandline"><img data-owl alt="" width="52" height="52"><span class="wordmark">Owl<i>y</i></span></h1>
    </div>
    <p class="pitch">เริ่มจากแบรนด์ที่คุณใช้ทุกวัน แล้วอ่านหุ้นของบริษัทนั้นให้เข้าใจใน 1 นาที</p>
    <ol class="steps" id="steps"></ol>
    <div class="notecard" id="notecard" aria-live="polite"></div>
    <p class="stage-foot">ตัวเลขทั้งหมดมาจากงบปี 2568 และข่าวที่เผยแพร่ พร้อมลิงก์ที่มา ปีที่คำนวณย้อนบอกไว้ในการ์ด การ์ดไม่ใช่คำแนะนำการลงทุน</p>
  </aside>

  <div class="phone">
    <div class="screen">
      <div class="notch" aria-hidden="true"></div>
      <div class="statusbar" aria-hidden="true"><span>9:41</span><span>5G</span></div>
      <div id="app"></div>
      <button type="button" class="aibar" id="aibar" aria-label="คุยกับน้องฮูก AI"><img data-owl alt="" width="26" height="26"><span>ถามน้องฮูก เช่น กองทุนไหนกำลังเปิดขาย</span><i aria-hidden="true"><svg width="16" height="16" viewBox="0 0 18 18"><path d="M9 14.5V3.5M4 8.5l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></i></button>
      <nav class="tabbar" aria-label="เมนูหลัก">
        <button type="button" data-nav="home"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l4.5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>หุ้น</button>
        <button type="button" data-nav="market"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3.5 17.5V4M3.5 17.5h15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6.5 13.5l3.6-3.8 2.8 2.4 4.6-5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ตลาด</span></button>
        <button type="button" data-nav="funds"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M4 9.5L11 4l7 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v6.5M9.3 10v6.5M12.7 10v6.5M16 10v6.5M3.5 18.5h15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>กองทุน</button>
        <button type="button" data-nav="reels"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="4" y="2.5" width="14" height="17" rx="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 8l5 3-5 3z" fill="currentColor"/></svg>คลิปสั้น</button>
      </nav>
      <div class="toast" id="toast" role="status" hidden></div>
      <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="คุยกับน้องฮูก">
        <div class="sheet-head"><img data-owl alt="" width="34" height="34"><div><b>คุยกับน้องฮูก (AI)</b><small id="sheetctx"></small></div><button type="button" id="sheetclose" aria-label="ปิดแชท"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
        <div class="chat sheet-log" id="gchatlog" aria-live="polite"></div>
        <div class="suggest" id="gsuggest"></div>
        <form class="composer" id="gform"><input id="ginput" aria-label="พิมพ์คำถามถึงน้องฮูก" placeholder="ถามเรื่องหุ้นหรือกองทุน" autocomplete="off"><button class="btn" type="submit" aria-label="ส่งคำถาม"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 14.5V3.5M4 8.5l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form>
        <div class="offline" id="gstatus" aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>
